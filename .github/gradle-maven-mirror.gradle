def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"

def patchRepos = { repos ->
    if (repos == null) return
    repos.all { repo ->
        if (repo instanceof MavenArtifactRepository) {
            def u = repo.url?.toString() ?: ""
            if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                repo.setUrl(URI.create(mirrorUrl))
            }
        }
    }
}

def ensureMirrorFirst = { repos ->
    if (repos == null) return
    patchRepos(repos)
    def existing = repos.find {
        it instanceof MavenArtifactRepository &&
        (it.url?.toString() ?: "").startsWith(mirrorUrl)
    }
    if (existing == null) {
        existing = repos.maven {
            name = "GoogleMavenCentralMirror"
            url = URI.create(mirrorUrl)
        }
    }
    repos.remove(existing)
    repos.addFirst(existing)
}

beforeSettings { settings ->
    try { patchRepos(settings.buildscript.repositories) } catch (ignored) {}
    try { patchRepos(settings.pluginManagement.repositories) } catch (ignored) {}
    try { patchRepos(settings.dependencyResolutionManagement.repositories) } catch (ignored) {}
}

settingsEvaluated { settings ->
    try {
        if (settings.pluginManagement.repositories.isEmpty()) {
            settings.pluginManagement.repositories.google()
            settings.pluginManagement.repositories.maven {
                name = "GoogleMavenCentralMirror"
                url = URI.create(mirrorUrl)
            }
            settings.pluginManagement.repositories.gradlePluginPortal()
        } else {
            ensureMirrorFirst(settings.pluginManagement.repositories)
        }
    } catch (ignored) {}
    try {
        if (!settings.dependencyResolutionManagement.repositories.isEmpty()) {
            ensureMirrorFirst(settings.dependencyResolutionManagement.repositories)
        }
    } catch (ignored) {}
}

beforeProject { proj ->
    try { ensureMirrorFirst(proj.buildscript.repositories) } catch (ignored) {}
    try { ensureMirrorFirst(proj.repositories) } catch (ignored) {}
}

allprojects { proj ->
    try { patchRepos(proj.buildscript.repositories) } catch (ignored) {}
    try { patchRepos(proj.repositories) } catch (ignored) {}
}
