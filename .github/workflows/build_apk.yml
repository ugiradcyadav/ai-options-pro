name: Build AI Options Pro Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Platform Wrapper & Internet Permissions
        run: |
          flutter create --platforms=android --org com.aioptionspro.trading .
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Compressed arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload Standalone Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Options-Pro-arm64-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
